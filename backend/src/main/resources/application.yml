spring:
  application:
    name: bookmarks
  # No datasource configured on purpose. With H2 on the classpath and no url set, Boot
  # auto-configures an in-memory database, so `./mvnw spring-boot:run` needs no setup — and a
  # prod profile with a missing DATABASE_URL then fails loudly instead of quietly falling back
  # to H2 and reporting healthy.
  jpa:
    # Flyway owns the schema. `validate` makes the app refuse to start if the entities and the
    # migrations have drifted apart.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    web:
      pageable:
        # Caps ?size=. Without this the default ceiling is 2000 and one request can ask for
        # most of the table.
        max-page-size: 100
  jackson:
    deserialization:
      # A field the API does not know is a 400, not a silent no-op. Without this a client
      # typo — {"favorite":true}, one letter short — returns 200 having changed nothing.
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      # Framework-raised errors come back as RFC 9457 too, so there is one error shape to
      # parse rather than Spring's default body for some errors and problem details for others.
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    level: "%5p [%X{traceId:-no-trace}]"

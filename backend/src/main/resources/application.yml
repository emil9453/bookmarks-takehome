spring:
  application:
    name: bookmarks
  # No datasource configured on purpose. With H2 on the classpath and no url set, Boot
  # auto-configures an in-memory database, so `./mvnw spring-boot:run` needs no setup — and a
  # prod profile with a missing DATABASE_URL then fails loudly instead of quietly falling back
  # to H2 and reporting healthy.
  jpa:
    # Flyway owns the schema. `validate` makes the app refuse to start if the entities and the
    # migrations have drifted apart.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    web:
      pageable:
        # Caps ?size=. Without this the default ceiling is 2000 and one request can ask for
        # most of the table.
        max-page-size: 100
  jackson:
    deserialization:
      # A field the API does not know is a 400, not a silent no-op. Without this a client
      # typo — {"favorite":true}, one letter short — returns 200 having changed nothing.
      fail-on-unknown-properties: true

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  # Hosts inject the port they want the app on. Not profile-specific: a deploy that somehow
  # ran without the prod profile should still bind the right port rather than fail confusingly.
  port: ${PORT:8080}

springdoc:
  # Expands the Pageable argument into page, size and sort instead of documenting it as one
  # opaque object. A property rather than @ParameterObject on the controller, so the endpoint
  # signature stays free of documentation-tool imports.
  default-flat-param-object: true

logging:
  pattern:
    level: "%5p [%X{traceId:-no-trace}]"

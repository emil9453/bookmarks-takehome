# Render blueprint. Lives at the repo root because that is the only place Render looks.
#
# Point Render at this repo and it configures the service from here, rather than from a dozen
# dashboard fields where a wrong root directory or a forgotten health-check path is easy to get
# and hard to spot.
services:
  - type: web
    name: bookmarks-api
    runtime: docker
    plan: free
    # Closer to the reviewers than the Oregon default.
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # Render restarts the service if this stops answering. It is also what makes a deploy that
    # cannot reach its database fail visibly instead of sitting there serving errors.
    healthCheckPath: /actuator/health
    envVars:
      # sync: false means "prompt for this in the dashboard, never store it here". The values
      # are database credentials and do not belong in a git repository.
      #
      # DATABASE_URL must be the JDBC form:
      #   jdbc:postgresql://<host>/<db>?sslmode=require
      # Neon's dashboard offers this under the JDBC connection-string option. Its default
      # postgres://user:pass@host/db is a different format and the app refuses to start on it.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
